<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Room Puzzle — place black half-block doors around numbered rooms. A logic puzzle that runs in the browser.">
<title>Room Puzzle</title>
<!-- loaded before anything paints, so the saved theme shows without a flash of the default one -->
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <header class="top">
    <h1><svg class="title-door" viewBox="0 0 24 30" aria-hidden="true" onclick="knockDoor()"><path d="M4 28V3a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v25z"/><rect x="0" y="27.5" width="24" height="2.5" rx="1"/><circle cx="15.5" cy="14.5" r="1.6"/></svg>Room Puzzle</h1>
    <button id="settingsBtn" class="icon-round-btn settings-btn" onclick="toggleSettings()" data-i18n-title="settingsOpen" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="settingsModal" class="modal-backdrop" hidden onclick="if(event.target === this) closeSettings()">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <button class="icon-round-btn modal-close" onclick="closeSettings()" data-i18n-title="settingsClose">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 id="settingsTitle" data-i18n="settingsTitle">설정</h2>
      <div class="setting-row">
        <span class="setting-label" data-i18n="settingBgm">BGM</span>
        <span class="stepper">
          <button id="bgmDown" onclick="changeVolume('bgm', -1)" data-i18n-title="soundDown">−</button>
          <span id="bgmBar" class="sound-bar" role="meter" aria-valuemin="0" aria-valuemax="5">
            <button class="sound-seg" onclick="setVolume('bgm', 1)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('bgm', 2)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('bgm', 3)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('bgm', 4)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('bgm', 5)" tabindex="-1"></button>
          </span>
          <button id="bgmUp" onclick="changeVolume('bgm', 1)" data-i18n-title="soundUp">+</button>
        </span>
      </div>
      <div class="setting-row">
        <span class="setting-label" data-i18n="settingSfx">SFX</span>
        <span class="stepper">
          <button id="sfxDown" onclick="changeVolume('sfx', -1)" data-i18n-title="soundDown">−</button>
          <span id="sfxBar" class="sound-bar" role="meter" aria-valuemin="0" aria-valuemax="5">
            <button class="sound-seg" onclick="setVolume('sfx', 1)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('sfx', 2)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('sfx', 3)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('sfx', 4)" tabindex="-1"></button>
            <button class="sound-seg" onclick="setVolume('sfx', 5)" tabindex="-1"></button>
          </span>
          <button id="sfxUp" onclick="changeVolume('sfx', 1)" data-i18n-title="soundUp">+</button>
        </span>
      </div>
      <div class="setting-row">
        <label for="langSelect" data-i18n="settingLang">언어</label>
        <select id="langSelect" onchange="setLang(this.value)">
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="it">Italiano</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="th">ไทย</option>
        </select>
      </div>
      <div class="setting-row">
        <span class="setting-label" id="themeLabel" data-i18n="settingTheme">테마</span>
        <span class="theme-options" role="radiogroup" aria-labelledby="themeLabel">
          <button class="theme-swatch theme-swatch-light" role="radio" data-theme-value="light" onclick="setTheme('light')" data-i18n-title="themeDefault"><span></span></button>
          <button class="theme-swatch theme-swatch-dark" role="radio" data-theme-value="dark" onclick="setTheme('dark')" data-i18n-title="themeDark"><span></span></button>
          <button class="theme-swatch theme-swatch-ivory" role="radio" data-theme-value="ivory" onclick="setTheme('ivory')" data-i18n-title="themeIvory"><span></span></button>
          <button class="theme-swatch theme-swatch-med" role="radio" data-theme-value="med" onclick="setTheme('med')" data-i18n-title="themeMed"><span></span></button>
          <button class="theme-swatch theme-swatch-rococo" role="radio" data-theme-value="rococo" onclick="setTheme('rococo')" data-i18n-title="themeRococo"><span></span></button>
          <button class="theme-swatch theme-swatch-cyber" role="radio" data-theme-value="cyber" onclick="setTheme('cyber')" data-i18n-title="themeCyber"><span></span></button>
        </span>
      </div>
    </div>
  </div>

  <div class="info-cards">
    <details id="rulesCard" class="legend" open>
      <summary data-i18n="rulesTitle">규칙</summary>
      <ol id="rulesList"></ol>
    </details>

    <details id="controlsCard" class="legend" open>
      <summary data-i18n="controlsTitle">조작법</summary>
      <ul data-i18n="controlsBody"></ul>
    </details>
  </div>

  <section id="modeSection" class="start-card">
    <h2 id="modeLabel" data-i18n="modeTitle">모드</h2>
    <div class="size-grid" role="radiogroup" aria-labelledby="modeLabel">
      <button class="size-btn mode-btn" role="radio" data-mode="plain" onclick="setMode('plain')" data-i18n-title="modePlain">
        <span class="mode-swatch"><span class="fill fill-up"></span></span>
      </button>
      <button class="size-btn mode-btn" role="radio" data-mode="knob" onclick="setMode('knob')" data-i18n-title="modeKnob">
        <span class="mode-swatch with-knob"><span class="fill fill-up"></span></span>
      </button>
    </div>
  </section>

  <section id="startScreen" class="start-card">
    <h2 data-i18n="sizeTitle">퍼즐 크기</h2>
    <div class="size-grid">
      <button class="size-btn" data-size="5" onclick="startGame(5)">5×5</button>
      <button class="size-btn" data-size="7" onclick="startGame(7)">7×7</button>
      <button class="size-btn" data-size="9" onclick="startGame(9)">9×9</button>
      <button class="size-btn" data-size="15" onclick="startGame(15)">15×15</button>
    </div>
  </section>

  <section id="recordsSection" class="start-card">
    <h2 data-i18n="recordsTitle">기록</h2>
    <table class="records-table">
      <thead><tr id="recordsHead"></tr></thead>
      <tbody>
        <tr id="recordsClears"></tr>
        <tr id="recordsTimes" class="best-times"></tr>
      </tbody>
    </table>
  </section>

  <section id="loadingScreen" class="start-card" hidden>
    <h2 data-i18n="loadingTitle">퍼즐 생성 중…</h2>
  </section>

  <section id="gameScreen" hidden>
    <div id="resultBanner" class="result-banner" hidden></div>
    <div id="toolPalette" class="tool-palette">
      <h2 class="tool-title">
        <button id="toolToggleBtn" class="tool-toggle" onclick="toggleToolsCollapsed()" aria-expanded="true" data-i18n-title="toolToggle">
          <span data-i18n="toolTitle">도구</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </h2>
      <div class="tool-rows">
        <div class="tool-buttons">
          <button class="tool-btn icon-tool compact-keep" data-dir="cycle-door" onclick="selectTool('cycle-door')" data-i18n-title="toolCycleDoor">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M4 21h16"/><circle cx="14.5" cy="12.5" r=".9" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="tool-btn" data-dir="up" onclick="selectTool('up')" data-i18n-title="tool_up">
            <span class="tool-swatch"><span class="fill fill-up"></span></span>
          </button>
          <button class="tool-btn" data-dir="down" onclick="selectTool('down')" data-i18n-title="tool_down">
            <span class="tool-swatch"><span class="fill fill-down"></span></span>
          </button>
          <button class="tool-btn" data-dir="left" onclick="selectTool('left')" data-i18n-title="tool_left">
            <span class="tool-swatch"><span class="fill fill-left"></span></span>
          </button>
          <button class="tool-btn" data-dir="right" onclick="selectTool('right')" data-i18n-title="tool_right">
            <span class="tool-swatch"><span class="fill fill-right"></span></span>
          </button>
        </div>
        <div class="tool-buttons">
          <button class="tool-btn icon-tool compact-keep" data-dir="cycle-mark" onclick="selectTool('cycle-mark')" data-i18n-title="toolCycleMark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 2l4 4-8 8H8v-4z"/><path d="M13.5 4.5l4 4"/><rect x="4" y="16.5" width="6" height="6" rx=".5"/></svg>
          </button>
          <button class="tool-btn" data-dir="q-tl" onclick="selectTool('q-tl')" data-i18n-title="tool_q_tl">
            <span class="tool-swatch"><span class="mark mark-q-tl"></span></span>
          </button>
          <button class="tool-btn" data-dir="q-tr" onclick="selectTool('q-tr')" data-i18n-title="tool_q_tr">
            <span class="tool-swatch"><span class="mark mark-q-tr"></span></span>
          </button>
          <button class="tool-btn" data-dir="q-bl" onclick="selectTool('q-bl')" data-i18n-title="tool_q_bl">
            <span class="tool-swatch"><span class="mark mark-q-bl"></span></span>
          </button>
          <button class="tool-btn" data-dir="q-br" onclick="selectTool('q-br')" data-i18n-title="tool_q_br">
            <span class="tool-swatch"><span class="mark mark-q-br"></span></span>
          </button>
        </div>
        <div class="tool-buttons">
          <button class="tool-btn icon-tool compact-keep" data-dir="cycle-strip" onclick="selectTool('cycle-strip')" data-i18n-title="toolCycleStrip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3l4 4-9 9H7v-4z"/><path d="M13.5 5.5l4 4"/><path d="M4 21h16"/></svg>
          </button>
          <button class="tool-btn" data-dir="s-up" onclick="selectTool('s-up')" data-i18n-title="tool_s_up">
            <span class="tool-swatch"><span class="mark mark-s-up"></span></span>
          </button>
          <button class="tool-btn" data-dir="s-down" onclick="selectTool('s-down')" data-i18n-title="tool_s_down">
            <span class="tool-swatch"><span class="mark mark-s-down"></span></span>
          </button>
          <button class="tool-btn" data-dir="s-left" onclick="selectTool('s-left')" data-i18n-title="tool_s_left">
            <span class="tool-swatch"><span class="mark mark-s-left"></span></span>
          </button>
          <button class="tool-btn" data-dir="s-right" onclick="selectTool('s-right')" data-i18n-title="tool_s_right">
            <span class="tool-swatch"><span class="mark mark-s-right"></span></span>
          </button>
        </div>
        <div class="tool-buttons">
          <button id="lockModeBtn" class="tool-btn lock-btn compact-keep" onclick="toggleLockMode()" data-i18n-title="toolLock">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </button>
          <button class="tool-btn eraser-btn compact-keep" data-dir="erase" onclick="selectTool('erase')" data-i18n-title="toolErase">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.2 3.8l4 4a1.5 1.5 0 0 1 0 2.1L11 19H7l-3.2-3.2a1.5 1.5 0 0 1 0-2.1l10.3-9.9a1.5 1.5 0 0 1 2.1 0z"/><path d="M9 9l6 6"/><path d="M11 19h9"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="solveTimer" class="solve-timer" aria-live="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9.5 2.5h5"/></svg>
      <span id="solveTimerText">00:00</span>
    </div>
    <div id="historyActions" class="actions">
      <button id="undoBtn" class="btn secondary icon-btn" onclick="undo()" data-i18n-title="undoTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="redoBtn" class="btn secondary icon-btn" onclick="redo()" data-i18n-title="redo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button id="zoomOutBtn" class="btn secondary icon-btn" onclick="changeZoom(-1)" data-i18n-title="zoomOut">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M7.5 10.5h6"/></svg>
      </button>
      <button id="zoomInBtn" class="btn secondary icon-btn" onclick="changeZoom(1)" data-i18n-title="zoomIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M7.5 10.5h6"/><path d="M10.5 7.5v6"/></svg>
      </button>
    </div>
    <div class="board-wrap">
      <div id="boardFrame" class="board-frame">
        <div id="colClues" class="knob-clues col-clues"></div>
        <div id="rowClues" class="knob-clues row-clues"></div>
        <div id="board" class="board"></div>
      </div>
    </div>
    <div id="submitActions" class="actions">
      <button id="restartBtn" class="btn danger-outline" onclick="restart()" data-i18n="restart">재시작</button>
      <button id="submitBtn" class="btn" onclick="submitAnswer()" data-i18n="submit">제출</button>
    </div>
  </section>

</div>

<!-- plain (non-module) scripts sharing one global scope, so index.html still runs when opened
     straight from disk; order matters only for the top-level code each one runs on load -->
<script src="js/generator.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/settings.js"></script>
<script src="js/game.js"></script>
</body>
</html>
